<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b63">
<title>Manajemen Iuran</title>
<style>
:root{--navy:#123b63;--blue:#1f6feb;--sky:#eaf3ff;--yellow:#f4c84a;--bg:#f4f7fb;--ink:#1e293b;--muted:#64748b;--line:#dce4ee;--white:#fff;--red:#b42318;--green:#137547}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--blue);color:white}button.secondary{background:#e8eef6;color:var(--navy)}button.danger{background:#fff0ef;color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.app{min-height:100vh}.topbar{background:var(--navy);color:white;padding:16px clamp(16px,4vw,36px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{margin:0;font-size:20px}.brand p{margin:1px 0 0;color:#d4e5f7;font-size:12px}.shell{max-width:1200px;margin:auto;padding:22px clamp(14px,3vw,28px)}.login-wrap{min-height:80vh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,420px);background:white;padding:28px;border-radius:20px;box-shadow:0 12px 40px #16324f12}.login-card h2{margin:0 0 8px;color:var(--navy)}.login-card p{color:var(--muted);margin:0 0 22px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:13px;font-weight:700;color:#334155}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:white;color:var(--ink)}.field textarea{min-height:72px;resize:vertical}.error{color:var(--red);font-size:13px;min-height:18px}.notice{padding:12px 14px;border-radius:12px;background:#fff8df;color:#735b00;font-size:13px;margin:0 0 16px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}.sidebar{background:white;border:1px solid var(--line);border-radius:16px;padding:12px;height:max-content;position:sticky;top:16px}.navbtn{width:100%;display:flex;gap:10px;align-items:center;text-align:left;margin:3px 0;background:transparent;color:#334155}.navbtn.active{background:var(--sky);color:var(--navy)}.main{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}.pagehead h2{margin:0;color:var(--navy);font-size:25px}.pagehead p{margin:4px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat .value{font-size:22px;font-weight:800;margin-top:7px;color:var(--navy);overflow-wrap:anywhere}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.panel h3{margin:0 0 14px;color:var(--navy);font-size:17px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .grow{flex:1;min-width:160px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px;background:white}th,td{padding:11px 12px;border-bottom:1px solid #e8edf3;text-align:left;vertical-align:top;font-size:13px}th{background:#f7f9fc;color:#526174;font-size:12px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:28px!important}.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:#eaf3ff;color:#1d4e89;font-size:11px;font-weight:750}.pill.green{background:#e7f8ef;color:var(--green)}.pill.red{background:#fff0ef;color:var(--red)}.small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.span2{grid-column:1/-1}.hr{height:1px;background:var(--line);margin:16px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#102a43;color:white;padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px #0002;z-index:20;max-width:90vw}.modal-backdrop{position:fixed;inset:0;background:#0b1f3380;display:grid;place-items:center;padding:14px;z-index:30}.modal{background:white;border-radius:18px;padding:22px;width:min(100%,560px);max-height:90vh;overflow:auto}.modal h3{margin:0 0 14px;color:var(--navy)}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.muted{color:var(--muted)}.mobile-nav{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px}.navbtn{white-space:nowrap;width:auto}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar .navbtn{padding:9px 11px}.sidebar .navbtn span:last-child{display:inline}}
@media(max-width:520px){.shell{padding:14px}.cards{gap:8px}.stat{padding:12px}.stat .value{font-size:18px}.panel{padding:13px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.pagehead h2{font-size:22px}.topbar{padding:12px 14px}.brand h1{font-size:18px}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="brand" style="margin-bottom:18px"><div class="logo">MI</div><div><h1 style="color:#123b63">Manajemen Iuran</h1><p style="color:#64748b">Pencatatan kegiatan dan keuangan</p></div></div>
    <div class="notice">Aplikasi khusus admin. Gunakan akun yang sudah dibuat melalui Firebase Authentication.</div>
    <form id="loginForm">
      <div class="field"><label for="email">Email admin</label><input id="email" type="email" autocomplete="username" required placeholder="admin@email.com"></div>
      <div class="field"><label for="password">Kata sandi</label><input id="password" type="password" autocomplete="current-password" required placeholder="Kata sandi"></div>
      <button style="width:100%" type="submit">Masuk</button>
      <div id="loginError" class="error" style="margin-top:10px"></div>
    </form>
  </div>
</div>
<div id="appView" class="app hidden">
  <header class="topbar">
    <div class="brand"><div class="logo">MI</div><div><h1>Manajemen Iuran</h1><p>Kelola kegiatan, peserta, dan kas</p></div></div>
    <div class="row"><span id="userEmail" class="small" style="color:#e1edfa"></span><button id="logoutBtn" class="secondary">Keluar</button></div>
  </header>
  <div class="shell">
    <div class="layout">
      <aside class="sidebar">
        <button class="navbtn active" data-page="dashboard"><span>▦</span><span>Dashboard</span></button>
        <button class="navbtn" data-page="events"><span>▣</span><span>Kegiatan</span></button>
        <button class="navbtn" data-page="finance"><span>▤</span><span>Buku Kas</span></button>
        <button class="navbtn" data-page="reports"><span>▥</span><span>Laporan</span></button>
      </aside>
      <main id="mainContent" class="main"><div class="panel">Memuat data…</div></main>
    </div>
  </div>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, getDoc, addDoc, setDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

/* Konfigurasi Web Firebase milik Mamang */
const firebaseConfig = {
  apiKey: "AIzaSyCLptzfb11LliqVs2OxkmuBQfipphPyNZI",
  authDomain: "manajemen-iuran.firebaseapp.com",
  projectId: "manajemen-iuran",
  storageBucket: "manajemen-iuran.firebasestorage.app",
  messagingSenderId: "511801879851",
  appId: "1:511801879851:web:5ddc86b9675c370113696e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const money = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
const dateFmt = v => { if(!v) return '-'; const d = typeof v==='string' ? new Date(v+'T00:00:00') : v.toDate ? v.toDate() : new Date(v); return isNaN(d) ? '-' : d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); };
const today = () => new Date().toLocaleDateString('en-CA');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentUser=null, events=[], selectedEvent=null, members=[], transactions=[], currentPage='dashboard', toastTimer;

function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.add('hidden'),3200); }
function errText(e){ console.error(e); if(e.code==='permission-denied') return 'Akses ditolak. Periksa Firestore Security Rules dan UID admin.'; if(e.code==='auth/invalid-credential') return 'Email atau kata sandi salah.'; if(e.code==='auth/too-many-requests') return 'Terlalu banyak percobaan. Coba lagi nanti.'; return e.message || 'Terjadi kesalahan. Coba lagi.'; }
function eventRef(id){return doc(db,'events',id)}
function memberCol(id){return collection(db,'events',id,'members')}
function txCol(id){return collection(db,'events',id,'transactions')}
function getBalance(list){return list.reduce((s,t)=>s+(t.status==='void'?0:(t.type==='expense'?-Number(t.amount||0):Number(t.amount||0))),0)}
function getPaid(memberId){return transactions.filter(t=>t.type==='payment'&&t.status!=='void'&&t.memberId===memberId).reduce((s,t)=>s+Number(t.amount||0),0)}
function eventStats(ev){const ts=ev._transactions||[];const ms=ev._members||[];const incoming=ts.filter(t=>t.status!=='void'&&t.type!=='expense').reduce((s,t)=>s+Number(t.amount||0),0);const expenses=ts.filter(t=>t.status!=='void'&&t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0);const obligations=ms.reduce((s,m)=>s+Number(m.requiredAmount??ev.defaultFee??0),0);const paid=ts.filter(t=>t.status!=='void'&&t.type==='payment').reduce((s,t)=>s+Number(t.amount||0),0);return {balance:Number(ev.openingBalance||0)+incoming-expenses,incoming,expenses,obligations,paid,arrears:Math.max(0,obligations-paid),participants:ms.length}}
async function loadEvents(){const snap=await getDocs(query(collection(db,'events'),orderBy('createdAt','desc')));events=snap.docs.map(d=>({id:d.id,...d.data()}));}
async function loadEventDetails(id){const [mSnap,tSnap]=await Promise.all([getDocs(memberCol(id)),getDocs(query(txCol(id),orderBy('paymentDate','desc')))]);members=mSnap.docs.map(d=>({id:d.id,...d.data()}));transactions=tSnap.docs.map(d=>({id:d.id,...d.data()}));selectedEvent=events.find(e=>e.id===id)||null;if(selectedEvent){const balance=Number(selectedEvent.openingBalance||0)+getBalance(transactions);if(Number(selectedEvent.cachedBalance||0)!==balance){await updateDoc(eventRef(id),{cachedBalance:balance,memberCount:members.length,updatedAt:serverTimestamp()});selectedEvent.cachedBalance=balance;selectedEvent.memberCount=members.length;}}}
async function refresh(){await loadEvents();if(selectedEvent&&events.some(e=>e.id===selectedEvent.id))await loadEventDetails(selectedEvent.id);render();}
function setPage(page){currentPage=page;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();}
function pageHead(title,sub,actions=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${sub||''}</p></div><div class="row">${actions}</div></div>`}
function stat(label,value){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div></div>`}
function emptyRow(cols,msg){return `<tr><td class="empty" colspan="${cols}">${msg}</td></tr>`}
function render(){
 const root=$('#mainContent');
 if(currentPage==='dashboard'){
   const all=events.map(e=>({...e,_members:e._members||[],_transactions:e._transactions||[]}));
   const knownBalances=all.reduce((s,e)=>s+Number(e.cachedBalance||0),0);
   root.innerHTML=pageHead('Dashboard','Ringkasan pengelolaan kegiatan iuran')+
   `<div class="cards">${stat('Jumlah kegiatan',events.length)}${stat('Kegiatan aktif',events.filter(e=>e.status!=='archived').length)}${stat('Total peserta',events.reduce((s,e)=>s+Number(e.memberCount||0),0))}${stat('Saldo tersimpan',money(knownBalances))}</div>
   <div class="panel"><div class="row" style="justify-content:space-between"><h3>Kegiatan terbaru</h3><button id="dashAddEvent">+ Kegiatan</button></div><div class="table-wrap"><table><thead><tr><th>Nama kegiatan</th><th>Tanggal</th><th>Iuran/peserta</th><th>Status</th><th></th></tr></thead><tbody>${events.slice(0,8).map(e=>`<tr><td><b>${esc(e.name)}</b><div class="small">${esc(e.description||'')}</div></td><td>${dateFmt(e.startDate)}</td><td>${money(e.defaultFee)}</td><td><span class="pill ${e.status==='archived'?'red':'green'}">${e.status==='archived'?'Arsip':'Aktif'}</span></td><td><button class="secondary" data-open-event="${e.id}">Buka</button></td></tr>`).join('')||emptyRow(5,'Belum ada kegiatan. Tambahkan kegiatan pertama.')}</tbody></table></div></div>
   <div class="notice">Catatan: angka saldo dan peserta di dashboard akan diperbarui saat data kegiatan dibuka dan disimpan. Gunakan menu Buku Kas untuk memeriksa rincian transaksi.</div>`;
   $('#dashAddEvent').onclick=()=>openEventModal();
 } else if(currentPage==='events'){
   root.innerHTML=pageHead('Kegiatan','Setiap kegiatan memiliki peserta dan buku kas terpisah.',`<button id="addEventBtn">+ Tambah kegiatan</button>`) +
   `<div class="panel"><div class="row"><input id="eventSearch" class="grow" placeholder="Cari nama kegiatan…"><select id="eventFilter"><option value="all">Semua status</option><option value="active">Aktif</option><option value="archived">Arsip</option></select></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Kegiatan</th><th>Tanggal</th><th>Nominal iuran</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="eventsRows"></tbody></table></div></div>`;
   $('#addEventBtn').onclick=()=>openEventModal(); renderEventRows();
   $('#eventSearch').oninput=renderEventRows; $('#eventFilter').onchange=renderEventRows;
 } else if(currentPage==='finance'){
   root.innerHTML=pageHead('Buku Kas','Pilih kegiatan untuk melihat saldo, pemasukan, dan pengeluaran.')+
   `<div class="panel"><div class="field"><label>Pilih kegiatan</label><select id="financeEvent"><option value="">-- Pilih kegiatan --</option>${events.map(e=>`<option value="${e.id}" ${selectedEvent?.id===e.id?'selected':''}>${esc(e.name)}${e.status==='archived'?' (Arsip)':''}</option>`).join('')}</select></div><div id="financeDetails">${selectedEvent?'<div class="small">Memuat buku kas…</div>':'<p class="muted">Pilih kegiatan untuk menampilkan buku kasnya.</p>'}</div></div>`;
   $('#financeEvent').onchange=async e=>{if(!e.target.value){selectedEvent=null;members=[];transactions=[];render();return}try{await loadEventDetails(e.target.value);render();}catch(ex){toast(errText(ex));}};
   if(selectedEvent) renderFinanceDetails();
 } else if(currentPage==='reports'){
   root.innerHTML=pageHead('Laporan','Unduh ringkasan kegiatan atau ekspor transaksi ke CSV.')+
   `<div class="panel"><h3>Ekspor laporan</h3><div class="field"><label>Kegiatan</label><select id="reportEvent"><option value="">-- Pilih kegiatan --</option>${events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="row"><button id="exportTransactions">Ekspor buku kas (CSV)</button><button class="secondary" id="exportMembers">Ekspor daftar peserta (CSV)</button></div><p class="small" style="margin-top:12px">CSV bisa dibuka di Excel atau diimpor ke Google Spreadsheet. Untuk BKU, ekspor transaksi berdasarkan kegiatan yang dipilih.</p></div>
   <div class="panel"><h3>Ringkasan</h3><div class="table-wrap"><table><thead><tr><th>Kegiatan</th><th>Status</th><th>Nominal iuran</th><th>Peserta tercatat</th></tr></thead><tbody>${events.map(e=>`<tr><td>${esc(e.name)}</td><td>${e.status==='archived'?'Arsip':'Aktif'}</td><td>${money(e.defaultFee)}</td><td>${Number(e.memberCount||0)}</td></tr>`).join('')||emptyRow(4,'Belum ada kegiatan.')}</tbody></table></div></div>`;
   $('#exportTransactions').onclick=()=>exportSelected('tx');$('#exportMembers').onclick=()=>exportSelected('members');
 }
 root.querySelectorAll('[data-open-event]').forEach(b=>b.onclick=async()=>{try{await loadEventDetails(b.dataset.openEvent);currentPage='finance';setPage('finance');}catch(e){toast(errText(e));}});
}
function renderEventRows(){const body=$('#eventsRows');if(!body)return;const q=$('#eventSearch').value.toLowerCase(),f=$('#eventFilter').value;const list=events.filter(e=>(e.name||'').toLowerCase().includes(q)&&(f==='all'||(f==='archived'?e.status==='archived':e.status!=='archived')));body.innerHTML=list.map(e=>`<tr><td><b>${esc(e.name)}</b><div class="small">${esc(e.description||'')}</div></td><td>${dateFmt(e.startDate)}</td><td>${money(e.defaultFee)}</td><td><span class="pill ${e.status==='archived'?'red':'green'}">${e.status==='archived'?'Arsip':'Aktif'}</span></td><td><div class="actions"><button data-open-event="${e.id}">Buka</button><button class="secondary" data-edit-event="${e.id}">Ubah</button><button class="secondary" data-archive-event="${e.id}">${e.status==='archived'?'Aktifkan':'Arsipkan'}</button><button class="danger" data-delete-event="${e.id}">Hapus</button></div></td></tr>`).join('')||emptyRow(5,'Kegiatan tidak ditemukan.');body.querySelectorAll('[data-open-event]').forEach(b=>b.onclick=async()=>{try{await loadEventDetails(b.dataset.openEvent);setPage('finance');}catch(e){toast(errText(e));}});body.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>openEventModal(events.find(e=>e.id===b.dataset.editEvent)));body.querySelectorAll('[data-archive-event]').forEach(b=>b.onclick=()=>toggleArchive(b.dataset.archiveEvent));body.querySelectorAll('[data-delete-event]').forEach(b=>b.onclick=()=>deleteEvent(b.dataset.deleteEvent));}
function openModal(title,body,onSave,saveLabel='Simpan'){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop"><div class="modal"><h3>${title}</h3><form id="modalForm">${body}<div id="modalError" class="error"></div><div class="modal-foot"><button type="button" class="secondary" id="modalCancel">Batal</button><button type="submit">${saveLabel}</button></div></form></div></div>`;root.querySelector('#modalCancel').onclick=()=>root.innerHTML='';root.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))root.innerHTML='';};root.querySelector('#modalForm').onsubmit=async e=>{e.preventDefault();const btn=root.querySelector('button[type=submit]');btn.disabled=true;try{await onSave(new FormData(e.target));root.innerHTML='';}catch(ex){root.querySelector('#modalError').textContent=errText(ex);btn.disabled=false;}};}
function openEventModal(ev=null){openModal(ev?'Ubah kegiatan':'Tambah kegiatan',`<div class="field"><label>Nama kegiatan *</label><input name="name" required value="${esc(ev?.name||'')}" placeholder="Contoh: Rihlah Santri"></div><div class="field"><label>Deskripsi</label><textarea name="description" placeholder="Keterangan singkat">${esc(ev?.description||'')}</textarea></div><div class="formgrid"><div class="field"><label>Tanggal kegiatan</label><input name="startDate" type="date" value="${esc(ev?.startDate||today())}"></div><div class="field"><label>Batas pembayaran</label><input name="dueDate" type="date" value="${esc(ev?.dueDate||'')}"></div><div class="field"><label>Iuran per peserta (Rp)</label><input name="defaultFee" type="number" min="0" step="1000" required value="${Number(ev?.defaultFee||0)}"></div><div class="field"><label>Saldo awal (Rp)</label><input name="openingBalance" type="number" min="0" step="1000" value="${Number(ev?.openingBalance||0)}"></div></div>`,async f=>{const data={name:f.get('name').trim(),description:f.get('description').trim(),startDate:f.get('startDate')||'',dueDate:f.get('dueDate')||'',defaultFee:Number(f.get('defaultFee')||0),openingBalance:Number(f.get('openingBalance')||0),updatedAt:serverTimestamp()};if(!data.name)throw Error('Nama kegiatan wajib diisi.');if(ev)await updateDoc(eventRef(ev.id),data);else await addDoc(collection(db,'events'),{...data,status:'active',memberCount:0,cachedBalance:data.openingBalance,createdAt:serverTimestamp(),createdBy:currentUser.uid});await refresh();toast(ev?'Kegiatan diperbarui.':'Kegiatan ditambahkan.');});}
async function toggleArchive(id){const ev=events.find(e=>e.id===id);if(!ev)return;if(!confirm(`${ev.status==='archived'?'Aktifkan kembali':'Arsipkan'} kegiatan "${ev.name}"?`))return;try{await updateDoc(eventRef(id),{status:ev.status==='archived'?'active':'archived',updatedAt:serverTimestamp()});await refresh();toast('Status kegiatan diperbarui.');}catch(e){toast(errText(e));}}
async function deleteEvent(id){const ev=events.find(e=>e.id===id);if(!ev)return;if(!confirm(`Hapus kegiatan "${ev.name}" beserta semua peserta dan transaksi? Tindakan ini tidak dapat dibatalkan.`))return;if(!confirm('Konfirmasi terakhir: semua data di dalam kegiatan ini akan dihapus permanen. Lanjutkan?'))return;try{const [ms,ts]=await Promise.all([getDocs(memberCol(id)),getDocs(txCol(id))]);const all=[...ms.docs,...ts.docs];for(let i=0;i<all.length;i+=450){const batch=writeBatch(db);all.slice(i,i+450).forEach(d=>batch.delete(d.ref));await batch.commit();}await deleteDoc(eventRef(id));if(selectedEvent?.id===id){selectedEvent=null;members=[];transactions=[];}await refresh();toast('Kegiatan dan datanya dihapus.');}catch(e){toast(errText(e));}}
function renderFinanceDetails(){const root=$('#financeDetails');if(!root||!selectedEvent)return;const st=eventStats({...selectedEvent,_members:members,_transactions:transactions});root.innerHTML=`<div class="cards">${stat('Saldo kas',money(st.balance))}${stat('Total pemasukan',money(st.incoming))}${stat('Pengeluaran',money(st.expenses))}${stat('Tunggakan iuran',money(st.arrears))}</div><div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h3 style="margin:0">${esc(selectedEvent.name)}</h3><div class="small">${members.length} peserta · Iuran standar ${money(selectedEvent.defaultFee)}</div></div><div class="row"><button id="addMemberBtn" class="secondary">+ Peserta</button><button id="addTxBtn">+ Transaksi</button></div></div><div class="row" style="margin:0 0 16px"><button class="secondary" id="showMembersBtn">Daftar peserta & tunggakan</button><button class="secondary" id="receiptBtn">Kuitansi terakhir</button><button class="secondary" id="exportThisBtn">Ekspor CSV</button></div><div id="memberPanel" class="panel hidden"><div class="row" style="justify-content:space-between"><h3>Peserta kegiatan</h3><input id="memberSearch" class="grow" placeholder="Cari peserta…"></div><div class="table-wrap"><table><thead><tr><th>Nama peserta</th><th>Nominal iuran</th><th>Terbayar</th><th>Sisa</th><th>Aksi</th></tr></thead><tbody id="memberRows"></tbody></table></div></div><h3 style="margin:18px 0 12px;color:#123b63">Riwayat buku kas</h3><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Uraian</th><th>Jenis</th><th>Metode</th><th>Masuk</th><th>Keluar</th><th>Aksi</th></tr></thead><tbody>${transactions.map(t=>`<tr><td>${dateFmt(t.paymentDate)}</td><td><b>${esc(t.note||typeName(t.type))}</b><div class="small">${esc(memberName(t.memberId)||'')}</div>${t.status==='void'?'<span class="pill red">Dibatalkan</span>':''}</td><td>${typeName(t.type)}</td><td>${esc(t.method||'-')}</td><td>${t.type!=='expense'&&t.status!=='void'?money(t.amount):'-'}</td><td>${t.type==='expense'&&t.status!=='void'?money(t.amount):'-'}</td><td><div class="actions"><button class="secondary" data-edit-tx="${t.id}">Ubah</button><button class="danger" data-void-tx="${t.id}">${t.status==='void'?'Aktifkan':'Batalkan'}</button></div></td></tr>`).join('')||emptyRow(7,'Belum ada transaksi pada kegiatan ini.')}</tbody></table></div>`;
 $('#addMemberBtn').onclick=()=>openMemberModal();$('#addTxBtn').onclick=()=>openTransactionModal();$('#showMembersBtn').onclick=()=>{const p=$('#memberPanel');p.classList.toggle('hidden');renderMemberRows();};$('#receiptBtn').onclick=()=>{const last=transactions.find(t=>t.type==='payment'&&t.status!=='void');if(last)downloadReceipt(last);else toast('Belum ada pembayaran untuk dibuatkan kuitansi.');};$('#exportThisBtn').onclick=()=>exportEventTransactions(selectedEvent.id);$('#memberSearch').oninput=renderMemberRows;root.querySelectorAll('[data-edit-tx]').forEach(b=>b.onclick=()=>openTransactionModal(transactions.find(t=>t.id===b.dataset.editTx)));root.querySelectorAll('[data-void-tx]').forEach(b=>b.onclick=()=>toggleVoidTx(b.dataset.voidTx));renderMemberRows();}
function typeName(t){return t==='payment'?'Iuran peserta':t==='income'?'Pemasukan lain':'Pengeluaran'}
function memberName(id){return members.find(m=>m.id===id)?.name||''}
function renderMemberRows(){const body=$('#memberRows');if(!body)return;const q=($('#memberSearch')?.value||'').toLowerCase();body.innerHTML=members.filter(m=>m.name.toLowerCase().includes(q)).map(m=>{const paid=getPaid(m.id),due=Number(m.requiredAmount??selectedEvent.defaultFee??0);return `<tr><td><b>${esc(m.name)}</b><div class="small">${esc(m.phone||'')}</div></td><td>${money(due)}</td><td>${money(paid)}</td><td>${money(Math.max(0,due-paid))}${paid>due?'<div class="small">Kelebihan '+money(paid-due)+'</div>':''}</td><td><div class="actions"><button class="secondary" data-pay-member="${m.id}">Bayar</button><button class="secondary" data-edit-member="${m.id}">Ubah</button><button class="danger" data-del-member="${m.id}">Hapus</button></div></td></tr>`}).join('')||emptyRow(5,'Belum ada peserta.');body.querySelectorAll('[data-pay-member]').forEach(b=>b.onclick=()=>openTransactionModal(null,b.dataset.payMember));body.querySelectorAll('[data-edit-member]').forEach(b=>b.onclick=()=>openMemberModal(members.find(m=>m.id===b.dataset.editMember)));body.querySelectorAll('[data-del-member]').forEach(b=>b.onclick=()=>deleteMember(b.dataset.delMember));}
function openMemberModal(m=null){if(!selectedEvent)return;openModal(m?'Ubah peserta':'Tambah peserta',`<div class="field"><label>Nama peserta *</label><input name="name" required value="${esc(m?.name||'')}"></div><div class="formgrid"><div class="field"><label>Nomor HP (opsional)</label><input name="phone" value="${esc(m?.phone||'')}"></div><div class="field"><label>Nominal iuran peserta (Rp)</label><input name="requiredAmount" type="number" min="0" step="1000" value="${Number(m?.requiredAmount??selectedEvent.defaultFee??0)}"></div></div><div class="field"><label>Catatan</label><textarea name="notes">${esc(m?.notes||'')}</textarea></div>`,async f=>{const data={name:f.get('name').trim(),phone:f.get('phone').trim(),requiredAmount:Number(f.get('requiredAmount')||0),notes:f.get('notes').trim(),updatedAt:serverTimestamp()};if(!data.name)throw Error('Nama peserta wajib diisi.');if(m)await updateDoc(doc(db,'events',selectedEvent.id,'members',m.id),data);else{await addDoc(memberCol(selectedEvent.id),{...data,createdAt:serverTimestamp()});await updateDoc(eventRef(selectedEvent.id),{memberCount:members.length+1,updatedAt:serverTimestamp()});}await loadEventDetails(selectedEvent.id);await refresh();setPage('finance');toast(m?'Data peserta diperbarui.':'Peserta ditambahkan.');});}
async function deleteMember(id){const m=members.find(x=>x.id===id);if(!m)return;if(transactions.some(t=>t.memberId===id&&t.status!=='void')){if(!confirm('Peserta ini memiliki riwayat pembayaran. Hapus peserta saja? Transaksi tetap tersimpan sebagai riwayat.'))return;}else if(!confirm(`Hapus peserta ${m.name}?`))return;try{await deleteDoc(doc(db,'events',selectedEvent.id,'members',id));await updateDoc(eventRef(selectedEvent.id),{memberCount:Math.max(0,members.length-1),updatedAt:serverTimestamp()});await loadEventDetails(selectedEvent.id);await refresh();setPage('finance');toast('Peserta dihapus.');}catch(e){toast(errText(e));}}
function openTransactionModal(t=null,memberId=''){if(!selectedEvent)return;const isPay=t?t.type==='payment':true;openModal(t?'Ubah transaksi':'Tambah transaksi',`<div class="field"><label>Jenis transaksi *</label><select name="type" id="txType"><option value="payment" ${(t?.type||'payment')==='payment'?'selected':''}>Pembayaran iuran peserta</option><option value="income" ${t?.type==='income'?'selected':''}>Pemasukan lain</option><option value="expense" ${t?.type==='expense'?'selected':''}>Pengeluaran</option></select></div><div class="field" id="memberField"><label>Peserta (untuk pembayaran iuran)</label><select name="memberId"><option value="">-- Pilih peserta --</option>${members.map(m=>`<option value="${m.id}" ${(t?.memberId||memberId)===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Tanggal *</label><input name="paymentDate" type="date" required value="${esc(t?.paymentDate||today())}"></div><div class="field"><label>Jumlah (Rp) *</label><input name="amount" type="number" min="1" step="1" required value="${Number(t?.amount||'')}"></div><div class="field"><label>Metode</label><select name="method"><option value="cash" ${(t?.method||'cash')==='cash'?'selected':''}>Tunai</option><option value="transfer" ${t?.method==='transfer'?'selected':''}>Transfer</option><option value="other" ${t?.method==='other'?'selected':''}>Lainnya</option></select></div><div class="field"><label>Referensi/bukti (opsional)</label><input name="reference" value="${esc(t?.reference||'')}" placeholder="Contoh: transfer BCA"></div></div><div class="field"><label>Uraian/catatan *</label><textarea name="note" required>${esc(t?.note||(isPay?'Pembayaran iuran':''))}</textarea></div>${t?'<div class="notice">Perubahan transaksi akan dicatat pada riwayat perubahan di dokumen transaksi. Pastikan nominal dan tanggal benar.</div>':''}`,async f=>{const type=f.get('type'),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)throw Error('Jumlah harus lebih dari nol.');if(type==='payment'&&!f.get('memberId'))throw Error('Pilih peserta untuk pembayaran iuran.');const data={type,memberId:type==='payment'?f.get('memberId'):'',paymentDate:f.get('paymentDate'),amount,method:f.get('method'),reference:f.get('reference').trim(),note:f.get('note').trim(),updatedAt:serverTimestamp(),updatedBy:currentUser.uid};if(!data.note)throw Error('Uraian wajib diisi.');if(t){await updateDoc(doc(db,'events',selectedEvent.id,'transactions',t.id),{...data,previousValue:{type:t.type,memberId:t.memberId||'',paymentDate:t.paymentDate,amount:t.amount,method:t.method||'',note:t.note||'',status:t.status||'active'},lastEditedAt:serverTimestamp()});}else{await addDoc(txCol(selectedEvent.id),{...data,status:'active',createdAt:serverTimestamp(),createdBy:currentUser.uid});}await loadEventDetails(selectedEvent.id);await refresh();setPage('finance');toast(t?'Transaksi diperbarui.':'Transaksi dicatat.');});const typeSel=$('#txType');const memberField=$('#memberField');const updateField=()=>memberField.classList.toggle('hidden',typeSel.value!=='payment');typeSel.onchange=updateField;updateField();}
async function toggleVoidTx(id){const t=transactions.find(x=>x.id===id);if(!t)return;const next=t.status==='void'?'active':'void';if(!confirm(next==='void'?'Batalkan transaksi ini? Riwayatnya tetap disimpan.':'Aktifkan kembali transaksi ini?'))return;try{await updateDoc(doc(db,'events',selectedEvent.id,'transactions',id),{status:next,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});await loadEventDetails(selectedEvent.id);await refresh();setPage('finance');toast('Status transaksi diperbarui.');}catch(e){toast(errText(e));}}
async function exportSelected(kind){const id=$('#reportEvent')?.value;if(!id){toast('Pilih kegiatan terlebih dahulu.');return;}try{await loadEventDetails(id);if(kind==='tx')exportEventTransactions(id);else exportMembersCSV();}catch(e){toast(errText(e));}}
function downloadCSV(filename,rows){const csv=rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(';')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);}
function exportEventTransactions(id){if(!selectedEvent||selectedEvent.id!==id){toast('Buka kegiatan terlebih dahulu dari menu Buku Kas.');return;}const rows=[['Tanggal','Nama Kegiatan','Jenis','Uraian','Nama Peserta','Metode','Pemasukan (Rp)','Pengeluaran (Rp)','Status','Referensi']];let balance=Number(selectedEvent.openingBalance||0);const sorted=[...transactions].sort((a,b)=>(a.paymentDate||'').localeCompare(b.paymentDate||''));rows.push([selectedEvent.startDate||'',selectedEvent.name,'Saldo awal','Saldo awal kegiatan','','',balance,0,'Aktif','']);for(const t of sorted){const valid=t.status!=='void';const masuk=valid&&t.type!=='expense'?Number(t.amount):0,keluar=valid&&t.type==='expense'?Number(t.amount):0;balance+=masuk-keluar;rows.push([t.paymentDate,selectedEvent.name,typeName(t.type),t.note,memberName(t.memberId),t.method,masuk,keluar,t.status==='void'?'Dibatalkan':'Aktif',t.reference||'']);}rows.push(['','','','','','TOTAL',balance,0,'Saldo akhir','']);downloadCSV('BKU-'+slug(selectedEvent.name)+'.csv',rows);toast('File CSV dibuat.');}
function exportMembersCSV(){if(!selectedEvent)return;const rows=[['Nama peserta','Nomor HP','Iuran wajib (Rp)','Sudah dibayar (Rp)','Sisa (Rp)','Catatan']];members.forEach(m=>{const due=Number(m.requiredAmount??selectedEvent.defaultFee??0),paid=getPaid(m.id);rows.push([m.name,m.phone,due,paid,Math.max(0,due-paid),m.notes]);});downloadCSV('Peserta-'+slug(selectedEvent.name)+'.csv',rows);toast('Daftar peserta diekspor.');}
function slug(s){return String(s||'kegiatan').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'kegiatan';}
async function downloadReceipt(t){const m=members.find(x=>x.id===t.memberId);const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;width:720px;padding:34px;background:white;color:#123b63;font-family:Arial,sans-serif;border:3px solid #123b63';wrap.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f4c84a;padding-bottom:18px"><div><div style="font-size:27px;font-weight:800">KUITANSI PEMBAYARAN</div><div style="font-size:14px;margin-top:5px">${esc(selectedEvent?.name||'Kegiatan')}</div></div><div style="background:#f4c84a;border-radius:12px;padding:12px 16px;font-weight:800">MI</div></div><div style="padding:24px 0;font-size:17px;line-height:2"><div>No. transaksi: <b>${esc(t.id.slice(-8).toUpperCase())}</b></div><div>Telah diterima dari: <b>${esc(m?.name||'Peserta')}</b></div><div>Jumlah: <b style="font-size:23px">${money(t.amount)}</b></div><div>Terbilang: <b>${esc(terbilang(Number(t.amount)))} rupiah</b></div><div>Untuk pembayaran: <b>${esc(t.note||'Iuran kegiatan')}</b></div><div>Tanggal: <b>${dateFmt(t.paymentDate)}</b></div><div>Metode: <b>${t.method==='transfer'?'Transfer':t.method==='cash'?'Tunai':'Lainnya'}</b></div></div><div style="display:flex;justify-content:space-between;align-items:end;border-top:1px solid #cbd5e1;padding-top:18px"><div style="font-size:12px;color:#64748b">Simpan kuitansi ini sebagai bukti pembayaran.</div><div style="text-align:center;width:190px">Penerima,<br><br><br><b>Admin/Bendahara</b></div></div>`;document.body.appendChild(wrap);try{const canvas=await window.html2canvas(wrap,{scale:2,backgroundColor:'#ffffff'});const a=document.createElement('a');a.download='Kuitansi-'+slug(m?.name||'peserta')+'-'+t.id.slice(-6)+'.png';a.href=canvas.toDataURL('image/png');a.click();}catch(e){toast('Gagal membuat kuitansi. Periksa koneksi internet.');}finally{wrap.remove();}}
function terbilang(n){if(n===0)return'nol';const a=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];function words(x){if(x<12)return a[x];if(x<20)return words(x-10)+' belas';if(x<100)return words(Math.floor(x/10))+' puluh '+words(x%10);if(x<200)return 'seratus '+words(x-100);if(x<1000)return words(Math.floor(x/100))+' ratus '+words(x%100);if(x<2000)return 'seribu '+words(x-1000);if(x<1e6)return words(Math.floor(x/1000))+' ribu '+words(x%1000);if(x<1e9)return words(Math.floor(x/1e6))+' juta '+words(x%1e6);return String(x)}return words(Math.floor(n)).replace(/\s+/g,' ').trim();}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';try{await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value);}catch(ex){$('#loginError').textContent=errText(ex);}});
$('#logoutBtn').onclick=()=>signOut(auth);
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
onAuthStateChanged(auth,async user=>{currentUser=user;if(user){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userEmail').textContent=user.email||'Admin';try{await loadEvents();setPage(currentPage);}catch(e){$('#mainContent').innerHTML=`<div class="panel"><h3>Data belum bisa dibuka</h3><p>${esc(errText(e))}</p><p class="small">Periksa Firestore Security Rules. Jangan mengubah rules menjadi akses publik.</p></div>`;}}else{$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');}});
</script>
